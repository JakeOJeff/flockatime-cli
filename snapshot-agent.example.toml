# Copy to ~/.snapshot-agent.toml and chmod 600 it.
# On Windows, write paths with forward slashes (C:/Users/you/...) or in
# single quotes ('C:\Users\you\...'): TOML reads \U in a double-quoted
# string as an escape code and will refuse to parse it.

endpoint = "https://collect.example.com"
api_key = "replace-me"
interval_seconds = 300
queue_path = "~/.snapshot-agent-queue.db"

[[project]]
name = "flockatime"
path = "D:/products/flockatime"

# When to capture at all. Omit this section and the agent captures every
# interval forever (source = "always").
#
# source = "wakatime" reads the files wakatime-cli rewrites on every heartbeat
# flush --- it only ever stats them, so it cannot delay or drop a heartbeat.
# The agent wakes on the first heartbeat, captures every interval while you
# work, and goes dormant once the editor has been quiet for
# idle_multiplier x interval_seconds. The next heartbeat wakes it again.
[activity]
source          = "wakatime"
idle_multiplier = 2     # dormant after 2 x interval_seconds of quiet
poll_seconds    = 30    # how often to check for a heartbeat
wakatime_dir    = "~/.wakatime"

# Optional. Find projects by scanning parent folders for git repositories, so
# a new checkout is tracked without adding a [[project]] entry for it. Any
# [[project]] entries above still apply and take priority.
#
# Scan narrowly. Every repository found is walked and hashed on every tick:
# pointing a root at a whole drive is quietly expensive. `doctor` prints how
# many it found and warns when that number gets silly.
[discovery]
roots     = ["D:/products"]
max_depth = 2
