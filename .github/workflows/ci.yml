name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is current
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The agent's whole premise is that file bytes reach the hasher and
      # nothing else, and that paths never leave the machine in plaintext.
      # hash.go is the only file allowed to open a file at all.
      - name: privacy constraints
        run: |
          fail=0
          offenders=$(grep -rln -E 'os\.ReadFile|io\.ReadAll|os\.Open' internal/snapshot \
            | grep -v '^internal/snapshot/hash.go$' | grep -v '_test\.go$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only internal/snapshot/hash.go may read file bytes:"
            echo "$offenders"
            fail=1
          fi
          if ! grep -q 'func TestWalkNeverReturnsPlaintextPaths' internal/snapshot/snapshot_test.go; then
            echo "::error::the plaintext-path guard test is missing"
            fail=1
          fi
          exit $fail

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -race -count=1 ./...

      # A snapshot the agent cannot actually take is not a passing build.
      - name: smoke test `once` on this checkout
        shell: bash
        run: |
          go build -o snapshot-agent-smoke .
          ./snapshot-agent-smoke once . > snap.json
          test -s snap.json
          grep -q '"tree_hash"' snap.json
          # No plaintext path from this repo may appear in the payload.
          if grep -qE 'commands\.go|internal/snapshot|\.gitignore' snap.json; then
            echo "::error::payload contains a plaintext path"
            exit 1
          fi

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null .
